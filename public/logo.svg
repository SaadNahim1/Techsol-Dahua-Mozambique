<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 210" fill="none">
  <!-- Shield + Eagle Camera Emblem -->
  <g transform="translate(15, 12)">
    <!-- Red Shield Top-Right & Bottom-Left Outline -->
    <path
      d="M84 36 C100 28, 108 18, 114 12 C122 20, 145 36, 184 44 C188 85, 184 126, 168 158"
      stroke="#D31118"
      stroke-width="9"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <path
      d="M42 62 C36 112, 54 168, 114 206 C136 192, 152 177, 162 162"
      stroke="#D31118"
      stroke-width="9"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- Black Eagle Top Wing / Brow Sweep -->
    <path
      d="M22 2 C48 28, 108 42, 144 68 C164 83, 170 105, 166 130 C154 106, 126 88, 88 74 C54 61, 32 48, 20 26 C16 16, 18 7, 22 2 Z"
      fill="#0A0A0A"
    />

    <!-- Black Eagle Lower Head & Beak + Camera Eye Cutout -->
    <path
      d="M50 68 C72 78, 102 88, 128 104 C156 121, 174 146, 172 178 C170 186, 167 193, 163 198 C161 182, 150 168, 132 162 C116 157, 98 156, 82 146 C60 132, 52 104, 50 68 Z"
      fill="#0A0A0A"
    />

    <!-- Camera Eye Outer White Space & Ring -->
    <circle cx="118" cy="122" r="24" fill="#FFFFFF" />
    <circle cx="118" cy="122" r="17" fill="#0A0A0A" />
    <circle cx="118" cy="122" r="12" fill="#FFFFFF" />
    <circle cx="118" cy="122" r="9.5" fill="#D31118" />
    <circle cx="121" cy="119" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- TECHSOL Wordmark -->
  <text
    x="230"
    y="118"
    fill="#0A0A0A"
    font-family="'Impact', 'Arial Black', 'Plus Jakarta Sans', sans-serif"
    font-weight="900"
    font-size="94"
    letter-spacing="1.5"
    textLength="310"
    lengthAdjust="spacingAndGlyphs"
  >
    TECHSOL
  </text>

  <!-- Tagline: Segurança Inteligente. Futuro Garantido. -->
  <text
    x="230"
    y="156"
    font-family="'Plus Jakarta Sans', 'Arial', sans-serif"
    font-weight="700"
    font-size="17.5"
    textLength="310"
    lengthAdjust="spacing"
  >
    <tspan fill="#0A0A0A">Segurança Inteligente. </tspan>
    <tspan fill="#D31118">Futuro Garantido.</tspan>
  </text>

  <!-- Vertical Black Divider -->
  <line x1="575" y1="28" x2="575" y2="182" stroke="#CBD5E1" stroke-width="3.5" stroke-linecap="round" />

  <!-- Dahua Technology Partner Block -->
  <g transform="translate(615, 26)">
    <!-- Red 'd' / '@' outer arc of Dahua logo -->
    <path
      d="M54 70 C34 78, 12 74, 6 56 C0 36, 18 10, 46 8 C68 7, 80 20, 78 40 L90 8 L106 8 L90 56 C88 62, 84 64, 74 64"
      stroke="#D31118"
      stroke-width="6.5"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Stylized 'a' inside red arc -->
    <text
      x="20"
      y="58"
      fill="#0A0A0A"
      font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif"
      font-weight="900"
      font-style="italic"
      font-size="50"
    >
      a
    </text>
    <!-- Red 'l' -->
    <path d="M76 58 L90 8 L104 8 L90 58 Z" fill="#D31118" />
    <!-- Black 'hua' -->
    <text
      x="106"
      y="58"
      fill="#0A0A0A"
      font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif"
      font-weight="900"
      font-style="italic"
      font-size="50"
      letter-spacing="-0.5"
    >
      hua
    </text>

    <!-- TECHNOLOGY subtext -->
    <text
      x="58"
      y="80"
      fill="#0A0A0A"
      font-family="'Plus Jakarta Sans', 'Arial', sans-serif"
      font-weight="800"
      font-size="13.5"
      letter-spacing="3"
    >
      TECHNOLOGY
    </text>

    <!-- Horizontal Red Divider Line -->
    <line x1="0" y1="96" x2="385" y2="96" stroke="#D31118" stroke-width="2.5" stroke-linecap="round" />

    <!-- MOZAMBIQUE PARTNER -->
    <text
      x="0"
      y="130"
      font-family="'Plus Jakarta Sans', 'Arial', sans-serif"
      font-weight="800"
      font-size="17.5"
      letter-spacing="0.8"
    >
      <tspan fill="#111827">MOZAMBIQUE </tspan>
      <tspan fill="#0B5FA5">PARTNER</tspan>
    </text>

    <!-- Mozambique Flag -->
    <g transform="translate(240, 112)">
      <!-- Green top stripe -->
      <rect x="0" y="0" width="44" height="8" fill="#00966E" />
      <!-- White fimbriation -->
      <rect x="0" y="8" width="44" height="1.5" fill="#FFFFFF" />
      <!-- Black middle stripe -->
      <rect x="0" y="9.5" width="44" height="7" fill="#0A0A0A" />
      <!-- White fimbriation -->
      <rect x="0" y="16.5" width="44" height="1.5" fill="#FFFFFF" />
      <!-- Yellow bottom stripe -->
      <rect x="0" y="18" width="44" height="8" fill="#FCE100" />
      <!-- Red hoist triangle -->
      <polygon points="0,0 20,13 0,26" fill="#D21034" />
      <!-- Yellow star inside triangle -->
      <polygon
        points="7,8.5 8.2,11.5 11.5,11.5 8.8,13.4 9.8,16.5 7,14.6 4.2,16.5 5.2,13.4 2.5,11.5 5.8,11.5"
        fill="#FCE100"
      />
    </g>
  </g>
</svg>
